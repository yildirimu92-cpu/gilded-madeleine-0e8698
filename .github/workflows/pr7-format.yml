name: PR7 one-time formatting
on:
  push:
    branches:
      - chatgpt/izyorder-pr7-homepage
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR7 files
        run: npx prettier --write src/pages/index.astro src/components/marketing/OrderPreview.astro tests/e2e/homepage.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/components/marketing/OrderPreview.astro tests/e2e/homepage.spec.ts
          git commit -m "style(pr7): format homepage, preview and tests"
          git push
