name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prüfen, testen, bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-Builds sind nie indexierbar (ADR 0005).
      CONTEXT: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Format prüfen
        run: npm run format:check

      - name: Linting
        run: npm run lint

      - name: Typprüfung
        run: npm run check

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Prototyp unverändert im Build
        run: cmp public/prototyp/index.html dist/prototyp/index.html

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E- und Accessibility-Tests
        run: npm run test:e2e

      - name: Homepage-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-screenshots
          path: test-results/**/homepage-*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Funktionsseiten-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-page-screenshots
          path: test-results/**/feature-*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Provisionsrechner-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commission-calculator-screenshots
          path: test-results/**/commission-calculator-*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Lighthouse CI (Performance-Budgets)
        run: npm run lighthouse

      - name: Lighthouse-Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
