name: PR11 one-time formatting
on:
  push:
    branches:
      - chatgpt/izyorder-pr11-commission-calculator
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR11 files
        run: |
          npx prettier --write src/lib/commission-calculator.ts src/components/marketing/CommissionCalculator.astro src/pages/provisionsrechner/index.astro tests/unit/commission-calculator.test.ts tests/e2e/commission-calculator.spec.ts docs/design/provisionsrechner-pr11.md .github/workflows/ci.yml
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/commission-calculator.ts src/components/marketing/CommissionCalculator.astro src/pages/provisionsrechner/index.astro tests/unit/commission-calculator.test.ts tests/e2e/commission-calculator.spec.ts docs/design/provisionsrechner-pr11.md .github/workflows/ci.yml
          git commit -m "style(pr11): format calculator and tests"
          git push
