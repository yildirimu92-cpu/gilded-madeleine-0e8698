name: PR9 one-time formatting
on:
  push:
    branches:
      - chatgpt/izyorder-pr9-demo-pilot
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR9 files
        run: |
          npx prettier --write src/config/lead.ts src/components/marketing/PilotLeadForm.astro src/pages/demo/index.astro src/pages/pilot/index.astro src/pages/intern/pilot/index.astro src/pages/pilot/danke/index.astro tests/unit/lead-gates.test.ts tests/e2e/pilot-gates.spec.ts docs/design/pr9-demo-pilot.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/lead.ts src/components/marketing/PilotLeadForm.astro src/pages/demo/index.astro src/pages/pilot/index.astro src/pages/intern/pilot/index.astro src/pages/pilot/danke/index.astro tests/unit/lead-gates.test.ts tests/e2e/pilot-gates.spec.ts docs/design/pr9-demo-pilot.md
          git commit -m "style(pr9): format demo and lead preparation"
          git push
