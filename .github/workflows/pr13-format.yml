name: PR13 one-time formatting
on:
  push:
    branches:
      - chatgpt/izyorder-pr13-b2c-discovery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR13 files
        run: |
          npx prettier --write src/pages/bestellen/index.astro src/styles/restaurant-finder.css src/scripts/restaurant-finder.ts tests/e2e/b2c-finder.spec.ts docs/design/b2c-finder-pr13.md docs/entwicklungsplan.md .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/bestellen/index.astro src/styles/restaurant-finder.css src/scripts/restaurant-finder.ts tests/e2e/b2c-finder.spec.ts docs/design/b2c-finder-pr13.md docs/entwicklungsplan.md .github/workflows/ci.yml
          git commit -m "style(pr13): format B2C finder and tests"
          git push
