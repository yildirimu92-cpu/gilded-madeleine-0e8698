name: PR12 one-time formatting
on:
  push:
    branches:
      - chatgpt/izyorder-pr12-b2c-search-core
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format PR12 files
        run: |
          npx prettier --write src/lib/restaurant-search.ts src/data/restaurant-schema.ts src/data/restaurants.ts tests/unit/restaurant-search.test.ts docs/design/b2c-search-pr12.md docs/entwicklungsplan.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/restaurant-search.ts src/data/restaurant-schema.ts src/data/restaurants.ts tests/unit/restaurant-search.test.ts docs/design/b2c-search-pr12.md docs/entwicklungsplan.md
          git commit -m "style(pr12): format B2C search model and tests"
          git push
